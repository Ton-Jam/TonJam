    <script>
      (function() {
        // Intercept Vite HMR WebSocket connection in iframe preview environment
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const isVite = (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
                           (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                           (typeof url === 'string' && (url.includes('24678') || url.includes('token=')));
            if (isVite) {
              const target = new EventTarget();
              target.readyState = 1;
              target.OPEN = 1;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() {};
              setTimeout(() => {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }

        // Suppress harmless Vite HMR WebSocket logs in console
        const origError = console.error;
        const origWarn = console.warn;
        const origInfo = console.info;
        const origLog = console.log;
        const isViteNoise = function(args) {
          return Array.from(args).some(arg => {
            if (!arg) return false;
            const str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
            return typeof str === 'string' && (str.includes('[vite]') || str.includes('WebSocket') || str.includes('ws://') || str.includes('wss://') || str.includes('vite-hmr'));
          });
        };
        console.error = function(...args) {
          if (isViteNoise(args)) return;
          return origError.apply(console, args);
        };
        console.warn = function(...args) {
          if (isViteNoise(args)) return;
          return origWarn.apply(console, args);
        };
        console.info = function(...args) {
          if (isViteNoise(args)) return;
          return origInfo.apply(console, args);
        };
        console.log = function(...args) {
          if (isViteNoise(args)) return;
          return origLog.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('[vite]') || event.message.includes('WebSocket'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          const msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (msg.includes('[vite]') || msg.includes('WebSocket')) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
