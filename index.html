
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TonJam | Decentralized Music Marketplace & NFT Platform on TON Blockchain</title>

    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="/tonjam-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="TonJam | Decentralized Music & NFT Marketplace on TON">
    <meta property="og:description" content="Discover, buy, and sell music NFTs from top Web3 artists on the TON blockchain. Join the decentralized music revolution.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tonjam.app">
    <meta property="og:image" content="https://tonjam.app/og-image.jpg">
    <meta property="og:site_name" content="TonJam">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TonJam | Decentralized Music & NFT Marketplace on TON">
    <meta name="twitter:description" content="Discover, buy, and sell music NFTs from top Web3 artists on the TON blockchain. Join the decentralized music revolution.">
    <meta name="twitter:image" content="https://tonjam.app/og-image.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
            background-color: #07111F;
            background: radial-gradient(circle at 50% -10%, rgba(0, 152, 234, 0.12), transparent 42%), #07111F;
            background-attachment: fixed;
            color: #FFFFFF;
            overflow-x: clip;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .glass {
            background: rgba(10, 22, 40, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: none;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        /* JAM Coin Icon Visibility */
        img[src*="TonjamCoin"] {
            filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.3));
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .animate-marquee {
            animation: marquee 30s linear infinite;
        }

        .hero-gradient {
            background: linear-gradient(to right, #0B0F14 0%, rgba(11, 15, 20, 0) 60%, rgba(11, 15, 20, 0) 100%);
        }
        
        .hero-bottom-gradient {
            background: linear-gradient(to top, #0B0F14 0%, rgba(11, 15, 20, 0) 100%);
        }

        /* Custom typography refinements */
        h1, h2, h3, h4, h5, h6, .font-black {
          letter-spacing: -0.02em;
          line-height: 1.3;
        }

        /* TON Connect Button Theming */
        tc-root {
          --tc-accent-color: #2563EB;
          --tc-text-color: #ffffff;
          --tc-bg-color: #0B0F14;
        }

        .scroll-row {
          display: flex;
          overflow-x: auto;
          gap: 1rem;
          padding-bottom: 1rem;
          scroll-snap-type: x mandatory;
          -webkit-overflow-scrolling: touch;
        }

        .scroll-row > * {
          scroll-snap-align: start;
        }
    </style>
    <script>
      // Aggressively unregister all Service Workers and clear all caches to prevent stale JS chunk execution
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          }).catch(function() {});
        }
      } catch (e) {}

      // Global boot error catcher to guarantee no silent blank screen before React mounts
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var errDiv = document.createElement('div');
          errDiv.id = 'tonjam-boot-error';
          errDiv.style.cssText = 'min-height:100vh;background:#07111F;color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;text-align:center;';
          errDiv.innerHTML = '<div style="max-width:500px;background:rgba(10,22,40,0.85);border:1px solid rgba(255,255,255,0.12);padding:32px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.5);">' +
            '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="font-size:18px;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;color:#ffffff;">TonJam Runtime Notice</h2>' +
            '<p style="font-size:13px;color:#94a3b8;margin-bottom:24px;line-height:1.5;">' + (e.message || 'An error occurred while loading application modules.') + '</p>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c)})})};window.location.reload();" style="padding:12px 24px;background:#0088CC;color:white;border:none;border-radius:6px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;">Clear Storage & Reload</button>' +
            '</div>';
          root.appendChild(errDiv);
        }
      });
    </script>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
